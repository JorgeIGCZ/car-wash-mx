# Additional worker, attached to the same database and private bucket as the app.
# Use an explicit env file; never copy .env.production to .env.
services:
  evidence-worker:
    build:
      context: .
      dockerfile: Dockerfile.evidence
    env_file:
      - ${EVIDENCE_ENV_FILE:?Set EVIDENCE_ENV_FILE to the worker environment file}
    restart: unless-stopped
    stop_grace_period: 5m
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
